<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#ffffff">
  <title>Entrar | Maravilha Gestão</title>
  <link rel="stylesheet" href="{{url_for('static',filename='css/bootstrap.min.css')}}"><link rel="stylesheet" href="{{url_for('static',filename='css/app.css')}}">
</head>
<body class="login-page">
<a href="#main" class="skip-link">Pular para o formulário</a>
<main id="main" class="login-wrapper" tabindex="-1">
  <div class="login-card">
    <div class="login-brand"><span class="brand-mark" aria-hidden="true">M</span><div><strong>Maravilha</strong><span>Gestão</span></div></div>
    <h1>Entrar</h1><p class="muted">Acesse sua conta para continuar.</p>
    {% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="flash flash-{{cat}}" role="status">{{msg}}</div>{% endfor %}{% endwith %}
    <form method="post" class="login-form" autocomplete="on"><input type="hidden" name="_csrf" value="{{csrf_token()}}">
      <div class="field"><label for="username">Usuário</label><input class="form-control" id="username" name="username" placeholder="Seu usuário" autocomplete="username" required autofocus maxlength="80"></div>
      <div class="field"><label for="password">Senha</label><input class="form-control" id="password" name="password" type="password" placeholder="Sua senha" autocomplete="current-password" required></div>
      <button class="btn btn-primary btn-lg btn-fill" type="submit">Entrar</button>
    </form>
    <p class="login-help">Ainda não tem acesso? Fale com o administrador.</p>
  </div>
</main>
</body>
</html>
