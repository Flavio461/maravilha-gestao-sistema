{% extends 'base.html' %}{% block content %}
<div class="page-heading"><div><span class="eyebrow">MINHA CONTA</span><h1>Alterar senha</h1><p>Use uma senha exclusiva, com no mínimo 12 caracteres.</p></div></div>
<section class="surface-card limit-card"><form class="small-form" method="post"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><div class="field"><label for="current">Senha atual</label><input id="current" type="password" name="current" class="form-control" required autocomplete="current-password"></div><div class="field"><label for="new">Nova senha</label><input id="new" type="password" name="new" class="form-control" required minlength="12" autocomplete="new-password"></div><div class="field"><label for="confirm">Confirmar nova senha</label><input id="confirm" type="password" name="confirm" class="form-control" required minlength="12" autocomplete="new-password"></div><button class="btn btn-primary">Atualizar senha</button></form></section>
{% endblock %}
